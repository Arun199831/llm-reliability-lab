[project]
name = "jevrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arun", email = "arunkumar33322@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "litellm>=1.102.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
]

[project.scripts]
jevrag = "jevrag:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
